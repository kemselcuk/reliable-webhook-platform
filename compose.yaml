services:
  postgres:
    image: postgres:17-alpine
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 200
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-webhook}
      POSTGRES_USER: ${POSTGRES_USER:-webhook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-webhook-local-only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - webhook

  kafka:
    image: apache/kafka:4.3.1
    cpus: 1.0
    mem_limit: 1g
    pids_limit: 300
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks:
      - webhook

  backend:
    cpus: 1.0
    mem_limit: 768m
    pids_limit: 200
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-webhook}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-webhook}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-webhook-local-only}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      WEBHOOK_OUTBOX_PUBLISHER_ENABLED: "true"
      WEBHOOK_DELIVERY_WORKER_ENABLED: "true"
      WEBHOOK_DELIVERY_RETRY_SCHEDULER_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health/readiness >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - webhook

  frontend:
    cpus: 0.5
    mem_limit: 128m
    pids_limit: 100
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/ >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - webhook

  prometheus:
    image: prom/prometheus:v3.5.0
    cpus: 0.5
    mem_limit: 512m
    pids_limit: 150
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - prometheus_data:/prometheus
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:9090/-/ready >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - webhook

  grafana:
    image: grafana/grafana:12.1.1
    cpus: 0.5
    mem_limit: 512m
    pids_limit: 150
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin-local-only}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/health >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - webhook

  demo-receiver:
    image: python:3.13-alpine
    profiles: [demo]
    command: ["python", "/demo/receiver.py"]
    user: "65534:65534"
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    cpus: 0.25
    mem_limit: 64m
    pids_limit: 50
    volumes:
      - ./demo:/demo:ro
    ports:
      - "${DEMO_RECEIVER_PORT:-18081}:8081"
    healthcheck:
      test: ["CMD", "python", "/demo/receiver.py", "--healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - webhook

volumes:
  postgres_data:
  kafka_data:
  prometheus_data:
  grafana_data:

networks:
  webhook:
