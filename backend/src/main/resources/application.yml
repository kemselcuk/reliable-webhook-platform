server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: reliable-webhook-platform
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:webhook}}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:webhook}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:webhook-local-only}}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      auto-offset-reset: earliest
      properties:
        max.poll.interval.ms: ${WEBHOOK_DELIVERY_WORKER_MAX_POLL_INTERVAL_MS:120000}
    listener:
      ack-mode: manual_immediate
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    phase: 3

webhook:
  delivery:
    worker:
      enabled: ${WEBHOOK_DELIVERY_WORKER_ENABLED:false}
      claim-timeout: ${WEBHOOK_DELIVERY_WORKER_CLAIM_TIMEOUT:PT5M}
      connect-timeout: ${WEBHOOK_DELIVERY_WORKER_CONNECT_TIMEOUT:PT2S}
      response-timeout: ${WEBHOOK_DELIVERY_WORKER_RESPONSE_TIMEOUT:PT10S}
      concurrency: ${WEBHOOK_DELIVERY_WORKER_CONCURRENCY:3}
      group-id: ${WEBHOOK_DELIVERY_WORKER_GROUP_ID:webhook-delivery-workers-v1}
      busy-redelivery-delay: ${WEBHOOK_DELIVERY_WORKER_BUSY_REDELIVERY_DELAY:PT0.5S}
    retry:
      max-attempts: ${WEBHOOK_DELIVERY_RETRY_MAX_ATTEMPTS:5}
      initial-delay: ${WEBHOOK_DELIVERY_RETRY_INITIAL_DELAY:PT1S}
      max-delay: ${WEBHOOK_DELIVERY_RETRY_MAX_DELAY:PT1H}
      jitter-factor: ${WEBHOOK_DELIVERY_RETRY_JITTER_FACTOR:0.20}
  outbox:
    publisher:
      enabled: ${WEBHOOK_OUTBOX_PUBLISHER_ENABLED:true}
      topic: ${WEBHOOK_OUTBOX_PUBLISHER_TOPIC:webhook.delivery.commands.v1}
      batch-size: ${WEBHOOK_OUTBOX_PUBLISHER_BATCH_SIZE:50}
      poll-interval: ${WEBHOOK_OUTBOX_PUBLISHER_POLL_INTERVAL:PT1S}
      claim-timeout: ${WEBHOOK_OUTBOX_PUBLISHER_CLAIM_TIMEOUT:PT5M}
      send-timeout: ${WEBHOOK_OUTBOX_PUBLISHER_SEND_TIMEOUT:PT10S}
      retry-delay: ${WEBHOOK_OUTBOX_PUBLISHER_RETRY_DELAY:PT5S}
