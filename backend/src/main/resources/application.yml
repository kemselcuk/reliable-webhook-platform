server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: reliable-webhook-platform
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:webhook}}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:webhook}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:webhook-local-only}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    phase: 1
