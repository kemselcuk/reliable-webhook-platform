name: CI

on:
  push:
    branches: [main, "feature/**", "fix/**", "refactor/**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify backend build and unit tests
        run: ./mvnw -B -DskipITs=true verify

  frontend:
    name: Frontend checks and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit test
        run: npm test
      - name: Production build
        run: npm run build

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run Failsafe integration tests
        run: ./mvnw -B -DskipUnitTests=true verify
      - name: Validate Compose definition
        working-directory: .
        run: |
          docker compose config --quiet
          docker compose --profile demo config --quiet
      - name: Validate local demo receiver
        working-directory: .
        run: python3 -m py_compile demo/receiver.py demo/verify.py
